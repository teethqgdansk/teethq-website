<style>
/* VOICE: quiet luxury, tender, a gift
   IDEA: a real silver envelope sealed with the TEETHQ mark
   PICTURE: the envelope that opens and releases the voucher, which turns in 3D
   COLOUR and TYPE: pearl silver + graphite #2E3338, Montserrat
   LAYOUT: one centred object on one screen, short line above, quiet links below */
:root{color-scheme:light dark;--bg:light-dark(#E6E9EC,#1c1f22);--bg2:light-dark(#F6F7F8,#2a2e33);--ink:light-dark(#2E3338,#E6E9EC);--mute:light-dark(#5a6168,#a3aab1);--line:light-dark(#8a9097,#6d747b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.55 Montserrat,system-ui,sans-serif;overflow-x:clip;
 background:radial-gradient(ellipse at 30% 12%,var(--bg2),var(--bg) 62%);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 36px}
.cap{font-weight:500;letter-spacing:.32em;text-transform:uppercase;font-size:13px;margin-right:-.32em;color:var(--mute);text-align:center}
h1{font-weight:500;font-size:clamp(26px,6vw,38px);line-height:1.1;letter-spacing:.16em;text-transform:uppercase;margin:10px 0 0;text-align:center;margin-right:-.16em}
.stage{--w:min(88vw,520px);width:var(--w);height:calc(var(--w)*.95);position:relative;margin:clamp(30px,7vh,64px) 0 10px;perspective:1400px}
.env{position:absolute;left:0;right:0;bottom:0;height:calc(var(--w)*.62);transition:transform .9s cubic-bezier(.6,0,.3,1),opacity .9s;cursor:pointer}
.back,.front,.flap{position:absolute;inset:0}
.back{background:linear-gradient(160deg,#D6DADE,#BFC5CB);border-radius:6px;box-shadow:0 30px 60px rgba(20,24,28,.28),0 6px 16px rgba(20,24,28,.16)}
.front{z-index:3;border-radius:6px;background:linear-gradient(165deg,#F5F6F7 0%,#E2E5E8 55%,#CDD2D7 100%);
 clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,255,255,.6),transparent 45%)}
.flap{z-index:4;height:58%;transform-origin:50% 0;transition:transform .8s cubic-bezier(.5,0,.2,1),z-index 0s .4s;transform-style:preserve-3d}
.flap i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#EEF0F2,#D3D8DC);backface-visibility:hidden}
.flap b{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(0deg,#C9CED3,#B6BCC2);transform:rotateX(180deg);backface-visibility:hidden}
.seal{position:absolute;left:50%;top:100%;width:62px;height:62px;margin:-36px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a5157,#23272b);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.25);backface-visibility:hidden;transition:opacity .3s}
.seal svg{width:44px}
.card{position:absolute;left:4%;right:4%;bottom:8%;aspect-ratio:567/281;z-index:2;transform-style:preserve-3d;
 transition:transform 1s cubic-bezier(.5,0,.2,1)}
.card .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;overflow:hidden;box-shadow:0 18px 40px rgba(20,24,28,.25)}
.card img{display:block;width:100%;height:100%}
.card .b{transform:rotateY(180deg)}
.spin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,0,.2,1)}
/* states */
.open .flap{transform:rotateX(180deg);z-index:0}
.open .seal{opacity:0}
.out .card{transform:translateY(-78%)}
.front-on .card{z-index:6;transform:translateY(-62%) scale(1.04);cursor:grab}
.front-on .env{transform:translateY(28%);opacity:.0;pointer-events:none}
.flip .spin{transform:rotateY(180deg)}
.hint{min-height:22px;font-size:14px;color:var(--mute);text-align:center;transition:opacity .4s}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px;opacity:0;transition:opacity .8s .2s}
.done .links{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font:500 13px Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;background:transparent;cursor:pointer}
.btn.fill{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,.env:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.motto{margin-top:26px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>

<script>
{
  const stage=document.getElementById('stage'),env=document.getElementById('env'),hint=document.getElementById('hint'),spin=document.getElementById('spin'),card=document.getElementById('card'),again=document.getElementById('again');
  let busy=false,opened=false,rot=0,drag=null;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  async function open(){
    if(busy||opened)return;busy=true;hint.style.opacity=0;
    stage.classList.add('open');await wait(750);
    stage.classList.add('out');await wait(1000);
    stage.classList.add('front-on');await wait(900);
    opened=true;busy=false;document.body.classList.add('done');
    hint.textContent='Dotknij vouchera, aby go obrócić';hint.style.opacity=1;
  }
  function setRot(d,anim){rot=d;spin.style.transition=anim?'':'none';spin.style.transform='rotateY('+d+'deg)'}
  env.addEventListener('click',open);
  env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  card.addEventListener('pointerdown',e=>{if(!opened)return;drag={x:e.clientX,r:rot,moved:false};card.setPointerCapture(e.pointerId)});
  card.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4)drag.moved=true;setRot(drag.r+dx*.6,false)});
  card.addEventListener('pointerup',()=>{if(!drag)return;const snap=drag.moved?Math.round(rot/180)*180:drag.r+180;drag=null;setRot(snap,true)});
  again.addEventListener('click',async()=>{
    if(busy)return;busy=true;document.body.classList.remove('done');setRot(0,true);hint.style.opacity=0;
    stage.classList.remove('front-on');await wait(700);stage.classList.remove('out');await wait(800);stage.classList.remove('open');await wait(700);
    opened=false;busy=false;hint.textContent='Dotknij koperty, aby ją otworzyć';hint.style.opacity=1;
  });
}
</script>
